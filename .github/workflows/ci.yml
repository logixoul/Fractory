name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (tsc + svelte-check)
        run: npm run typecheck

      # Every automated test uses FakeWorker and real git in temp repos: no model is ever called.
      - name: Unit and integration tests
        run: npm test

      # Builds everything, then drives the built GUI in headless Chrome against a fake duel run.
      # Chrome is preinstalled on GitHub-hosted runners (Playwright channel "chrome").
      - name: GUI smoke test (Playwright)
        run: npm run e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}-node${{ matrix.node }}
          path: packages/web/test-results
          if-no-files-found: ignore

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Fails on moderate or worse. Two low build-time findings (deepmerge via the Svelte Vite
      # plugin) are known; see docs/decisions-todo.md.
      - name: Audit
        run: npm audit --audit-level=moderate
